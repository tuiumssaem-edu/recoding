<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한걸음 행동노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --ink:#2e2a33; --muted:#867f8c; --line:#efe7dc; --soft:#f7f1e8;
  --mc:#ef6f53; --mc-soft:#fdebe5; --mc-ink:#c4472c;
  --ok:#22a06b; --i1:#3cb371; --i2:#f2a91e; --i3:#ec5b5b;
  --r:20px; --shadow:0 2px 0 rgba(46,42,51,.04),0 8px 24px -12px rgba(46,42,51,.18);
}
body[data-m=abc]{--mc:#ef6f53;--mc-soft:#fdebe5;--mc-ink:#c4472c}
body[data-m=freq]{--mc:#1f9e89;--mc-soft:#dcf3ee;--mc-ink:#137565}
body[data-m=dur]{--mc:#7a5fd6;--mc-soft:#ece6fb;--mc-ink:#5a3fb5}
body[data-m=settings]{--mc:#5b6b80;--mc-soft:#eaeef3;--mc-ink:#3f4d60}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;letter-spacing:-.01em;
  background-image:radial-gradient(circle at 10% -10%,#ffe4d6 0,transparent 40%),radial-gradient(circle at 100% 0,#e3f3ee 0,transparent 35%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--mc-ink)}

/* ── 머리말 ── */
.hero{max-width:1100px;margin:0 auto;padding:22px 18px 10px;display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:0 0 auto;
  background:linear-gradient(135deg,#ffd3c2,#ffe9a8);box-shadow:var(--shadow);transform:rotate(-6deg)}
.hero h1{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:0}
.hero h1 em{font-style:normal;color:var(--mc)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.today{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.today b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:20px;color:var(--ink)}

/* ── 고정 바: 학생 + 탭 ── */
.stickybar{position:sticky;top:0;z-index:20;background:rgba(251,247,241,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.stickyin{max-width:1100px;margin:0 auto;padding:10px 18px 0}
.stubar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.stubar::-webkit-scrollbar{display:none}
.stu-q{font-size:13px;color:var(--muted);white-space:nowrap;margin-right:2px}
.stu-chip{display:flex;align-items:center;gap:8px;flex:0 0 auto;border:2px solid transparent;background:var(--card);border-radius:999px;
  padding:4px 14px 4px 4px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.stu-chip:hover{transform:translateY(-1px)}
.stu-chip .nm{font-weight:600;font-size:15px}
.stu-chip.on{border-color:var(--mc);background:var(--mc-soft)}
.stu-chip.on .nm{color:var(--mc-ink);font-size:17px;font-weight:800}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:0 0 auto}
.stu-chip.on .av{width:36px;height:36px;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.tabs button:hover{background:#fff}
.tabs button.on{background:var(--mc);color:#fff;box-shadow:0 6px 16px -8px var(--mc)}
.tabs .ic{font-size:17px}

/* ── 기록/대시보드 전환 ── */
.seg{display:flex;gap:4px;max-width:520px;margin:16px auto 0;padding:4px;background:#efe8de;border-radius:999px}
.seg button{flex:1;padding:10px 12px;border:0;background:transparent;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);transition:.15s}
.seg button.on{background:#fff;color:var(--mc-ink);box-shadow:var(--shadow)}
main{max-width:1100px;margin:0 auto;padding:16px 18px 90px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 카드 · 글자 ── */
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid #f3ece2}
h2{font-family:'Jua','Pretendard',sans-serif;font-weight:400;font-size:23px;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:0}
h3{font-size:16.5px;font-weight:700;margin:0 0 12px}
h4{font-size:14px;margin:0 0 10px;color:var(--ink);font-weight:700}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--mc-soft);color:var(--mc-ink);border-radius:999px;padding:3px 14px 3px 3px;
  font-family:'Pretendard',sans-serif;font-size:16px;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}
.fld{margin-bottom:18px}.lab{font-weight:700;margin-bottom:8px}
input[type=text],input[type=password],input[type=date],input[type=time],input:not([type]),select,textarea{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);transition:.15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--mc);background:#fff;box-shadow:0 0 0 4px var(--mc-soft)}
label{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
.row2 label,.filters label,.card>label,.stucard label{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;transition:.12s}
.chip:hover{border-color:var(--mc)}
.chip.on{background:var(--mc);border-color:var(--mc);color:#fff;font-weight:700}

/* ── 버튼 ── */
button.pri,button.ghost,button.go,button.stop{border-radius:14px;padding:11px 18px;cursor:pointer;font-weight:700;border:0;transition:transform .1s,box-shadow .15s}
button.pri:active,button.go:active,button.stop:active,button.ghost:active{transform:scale(.97)}
button.pri{background:var(--mc);color:#fff;box-shadow:0 8px 18px -10px var(--mc)}
button.pri:disabled{opacity:.55}
button.ghost{background:#fff;border:1.5px solid var(--line)}
button.ghost:hover{border-color:var(--mc);color:var(--mc-ink)}
button.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
button.sm{padding:5px 12px;font-size:13px;border-radius:10px}
button.go{background:var(--ok);color:#fff;flex:1;padding:15px;font-size:17px;box-shadow:0 8px 18px -10px var(--ok)}
button.stop{background:var(--i3);color:#fff;flex:1;padding:15px;font-size:17px;box-shadow:0 8px 18px -10px var(--i3)}
.ibtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ibtns button{border:0;border-radius:16px;padding:16px 0;font-size:18px;font-weight:800;cursor:pointer;transition:transform .08s}
.ibtns button:active{transform:scale(.93)}
.ibtns .i1{background:#e3f6ea;color:#1f8a4c}.ibtns .i2{background:#fdf1d6;color:#b07a06}.ibtns .i3{background:#fde3e3;color:#c43a3a}
.ibtns .i1.on,.ibtns .i1:hover{background:var(--i1);color:#fff}
.ibtns .i2.on,.ibtns .i2:hover{background:var(--i2);color:#fff}
.ibtns .i3.on,.ibtns .i3:hover{background:var(--i3);color:#fff}

/* ── 행동 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.bcard{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid #f3ece2;border-top:5px solid var(--mc)}
.bcard.run{border-top-color:var(--i3);box-shadow:0 0 0 3px #fde3e3,var(--shadow);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #fde3e3,var(--shadow)}}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bhead b{font-size:17px}
.cnt{background:var(--mc-soft);color:var(--mc-ink);border-radius:999px;min-width:36px;text-align:center;padding:2px 12px;font-weight:800;font-size:17px}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;color:var(--i3)}
.mini{font-size:13px;color:var(--muted);margin-top:10px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow input{flex:1;min-width:160px}

/* ── 대시보드 ── */
.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap}
.filters select{min-width:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid #f3ece2;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:var(--mc-soft)}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;position:relative;z-index:1}
.stat .v{font-size:22px;font-weight:800;margin-top:2px;word-break:keep-all;position:relative;z-index:1}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:16px}
.cbox{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid #f3ece2}
.cwrap{position:relative;height:240px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
.tscroll{overflow-x:auto}


.bcard{padding:13px 14px}.bhead{margin-bottom:9px}.mini{margin-top:7px}
/* 대시보드 하위 탭 */
.dtabs{display:flex;gap:4px;background:#efe8de;border-radius:999px;padding:4px;margin-left:auto}
.dtabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.dtabs button.on{background:#fff;color:var(--mc-ink);box-shadow:var(--shadow)}
.filters{padding:12px 18px}
.dash[data-dtab=chart] .dtable{display:none}
.dash[data-dtab=table] .stats,.dash[data-dtab=table] .charts{display:none}
.stats{gap:10px;margin-bottom:14px}.stat{padding:10px 14px}.stat .v{font-size:20px}
.cbox{padding:12px 14px}.cbox h4{margin-bottom:6px}
.tgrid{display:grid;gap:14px}
.tscroll th{position:sticky;top:0;z-index:1}

/* 설정 버튼 (오른쪽 위, 따로) */
.gear{display:flex;align-items:center;gap:6px;flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.gear:hover{border-color:#5b6b80}
.gear.on{background:#5b6b80;border-color:#5b6b80;color:#fff}
#abcNow{white-space:nowrap;padding:9px 14px;height:44px}
@media (min-width:1000px){
  main{padding-bottom:16px}
  .split{grid-template-columns:minmax(0,1fr) 320px}
  .split>.card:first-child{margin-bottom:0}
  .side{position:sticky;top:122px;max-height:calc(100vh - 140px);overflow:auto;margin-bottom:0}
  .form2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .charts{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:0}
  .charts .cbox{grid-column:auto!important}
  .cwrap{height:calc((100vh - 480px)/2);min-height:110px;max-height:320px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .tgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:start}
  .tgrid>.card{margin-bottom:0}
  .dtable .tscroll{max-height:calc(100vh - 335px);overflow:auto}
}
@media (max-width:999px){
  .navrow{flex-wrap:wrap}.navrow .seg{width:100%}
}
@media (max-width:700px){
  .toprow{flex-wrap:wrap;gap:6px 10px}
  .toprow .stubar{order:3;flex-basis:100%}
  .brand p{display:none}.brand h1{font-size:20px}.brand .logo{width:34px;height:34px;font-size:19px}
  .toprow .today{margin-left:auto;font-size:12.5px}
  .gear span{display:none}.gear{padding:7px 10px}
  .foot{flex-direction:column}.foot .big{flex:auto;width:100%}
  .filters{gap:10px}.dtabs{margin-left:0;width:100%}.dtabs button{flex:1;padding:7px 6px}
}
</style>
</head>
<body data-m="abc">
<div class="stickybar"><div class="stickyin">
  <div class="toprow">
    <div class="brand"><div class="logo">🌱</div><div><h1>한걸음 <em>행동노트</em></h1><p>관찰하고 · 이해하고 · 함께 자라요</p></div></div>
    <div class="stubar" id="stuBar"></div>
    <div class="today" id="today"></div>
    <button class="gear" id="gearBtn" title="학생·행동 설정">⚙️ <span>설정</span></button>
  </div>
  <div class="navrow">
    <nav class="tabs">
      <button data-m="abc" class="on"><span class="ic">📝</span>ABC 기록</button>
      <button data-m="freq"><span class="ic">🔢</span>빈도 기록</button>
      <button data-m="dur"><span class="ic">⏱️</span>지속시간 기록</button>
    </nav>
    <div class="seg" id="seg">
      <button data-v="record" class="on">✏️ 기록하기</button>
      <button data-v="dash">📊 대시보드</button>
    </div>
  </div>
</div></div>
<main>
  <section class="view on" id="abc-record"></section>
  <section class="view" id="abc-dash"></section>
  <section class="view" id="freq-record"></section>
  <section class="view" id="freq-dash"></section>
  <section class="view" id="dur-record"></section>
  <section class="view" id="dur-dash"></section>
  <section class="view" id="settings"></section>
</main>
<div id="toast"></div>

<script>
/* ═════════════ 공통 ═════════════ */
const S = { config:null, files:{}, method:'abc', view:'record', student:'',
            days:30, beh:'', cache:{}, charts:[], rows:[], freqToday:[], durToday:[], place:'', abcI:0 };
const I_LABEL = {1:'약',2:'중',3:'강'};
const I_COLOR = {1:'#3cb371',2:'#f2a91e',3:'#ec5b5b'};
const PALETTE = ['#ef6f53','#1f9e89','#7a5fd6','#e0a01c','#3b82c4','#d6517d','#4f9a3a','#c26a2e','#5b6b80','#a3577e'];
const METHOD_LABEL = {abc:'ABC 기록',freq:'빈도 기록',dur:'지속시간 기록'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = s => ($(s)?.value || '').trim();
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const splitList = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function fmtSec(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function toast(msg,bad){ const t=$('#toast'); t.textContent=msg; t.className='show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='',2400); }
function run(fn,...args){ return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)); }
const errMsg = e => (e && e.message) || String(e);
const stu = () => (S.config.students||[]).find(s=>s.name===S.student) || {name:S.student,abc:[],freq:[],dur:[]};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
if (window.Chart) { Chart.defaults.font.family="'Pretendard',sans-serif"; Chart.defaults.color='#867f8c'; Chart.defaults.borderColor='#f1eae0';
  Chart.defaults.elements.bar.borderRadius=6; Chart.defaults.elements.line.borderWidth=2.5; Chart.defaults.elements.point.radius=3; }

/* ═════════════ 시작 ═════════════ */
async function init(){
  const d=new Date(); $('#today').innerHTML=`📅 ${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
  S.student = lsGet('bh_student','');
  S.place = lsGet('bh_place','');
  bindNav();
  if (typeof google === 'undefined' || !google.script) { showFatal('이 화면은 Apps Script 웹 앱 주소(…/exec)로 열어야 작동합니다.'); return; }
  const local=lsGet('bh_state',null);
  if(local && local.config){ applyState(local); loadLocal(S.student); render(); }   // ① 지난번 사본으로 바로 화면 표시
  let st;
  try { st=await run('getAppState', S.student); }
  catch(e){ if(!local) showFatal(errMsg(e)); else toast('서버 연결이 늦어요. 저장된 기록으로 보여드리는 중입니다.',true); return; }
  const changed = !local || JSON.stringify(local.config)!==JSON.stringify(st.config);
  lsSet('bh_state',{config:st.config,files:st.files});
  applyState(st);
  if(st.packed) setPacked(st.packedFor, st.packed);                                   // ② 세 기록법 데이터가 함께 도착
  loadLocal(S.student);
  prefetch();                       // 없는 기록은 세 기록법을 한 번에 요청 (화면 그리기 전에 시작)
  if(changed) render(); else refreshView();
}
/* 서버 연결 실패 시 원인과 해결 방법을 화면에 표시 */
function showFatal(msg){
  S.config=null;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  const el=$('#abc-record'); el.classList.add('on'); $('#seg').style.display='none';
  el.innerHTML=`<div class="card" style="border-color:var(--i3)">
    <h2 style="color:var(--i3)">서버에 연결하지 못했습니다</h2>
    <p><b>오류 내용:</b></p>
    <pre style="white-space:pre-wrap;background:#fff5f5;padding:10px;border-radius:8px;font-size:13px">${esc(msg)}</pre>
    <p><b>흔한 원인과 해결 방법</b></p>
    <ol style="padding-left:20px;line-height:1.8">
      <li><b>브라우저에 구글 계정이 여러 개 로그인됨</b> → 시크릿 창(Ctrl+Shift+N)에서 앱을 만든 계정 하나로만 로그인하고 다시 여세요. 가장 흔한 원인입니다.</li>

function bindNav(){

function render(){

  if (!S.config) { toast('아직 서버 설정을 불러오지 못했습니다. 안내에 따라 해결 후 [다시 시도]를 눌러 주세요.', true); return; }
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.method));

/* 칩(미리 설정한 선택지) + 직접 입력 */
function field(id,label,items,ph,multi){
  return `<div class="fld"><div class="lab">${label}</div>
    <div class="chips" data-for="${id}" data-multi="${multi?1:0}">${(items||[]).map(x=>`<button type="button" class="chip">${esc(x)}</button>`).join('')}</div>
    <input id="${id}" type="text" placeholder="${esc(ph)}" autocomplete="off"></div>`;
}
function bindChips(root){
  root.querySelectorAll('.chips').forEach(box=>{
    const inp=root.querySelector('#'+box.dataset.for), multi=box.dataset.multi==='1';
    const sync=()=>{ const cur=splitList(inp.value); box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',cur.includes(c.textContent))); };
    box.onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; const v=c.textContent; let cur=splitList(inp.value);
      if(multi){ cur=cur.includes(v)?cur.filter(x=>x!==v):cur.concat(v); inp.value=cur.join(', '); }
      else inp.value=(cur.length===1&&cur[0]===v)?'':v;
      sync(); inp.dispatchEvent(new Event('change')); };
    inp.addEventListener('input',sync); inp._sync=sync; sync();
  });
}
function placeField(id){
  return field(id,'장소 / 활동 <span class="muted small">(선택 · 바꿀 때까지 유지)</span>',S.config.places,'예: 수학 시간 모둠활동',false);

async function tapFreq(behavior,intensity){
  const now=new Date(), tmp={id:'tmp'+now.getTime()+Math.random(),date:ymd(now),dow:DOW[now.getDay()],behavior,intensity,time:hm(now)+':'+pad(now.getSeconds()),place:S.place,pending:true};
  S.freqToday.push(tmp); drawFreqCards(); if(navigator.vibrate) navigator.vibrate(30);
  try{ const res=await run('saveFrequency',{student:S.student,behavior,intensity,place:S.place,ts:now.getTime()});
       tmp.id=res.id; tmp.pending=false; cacheAdd('freq',{...tmp,pending:undefined}); }
  catch(e){ S.freqToday=S.freqToday.filter(r=>r!==tmp); toast('저장 실패: '+errMsg(e),true); }
  drawFreqCards();
}
async function addBehavior(kind,sel){
  const name=val(sel); if(!name) return;
  const s=S.config.students.find(x=>x.name===S.student); if(!s) return;
  if(!s[kind].includes(name)) s[kind].push(name);
  try{ applyState(await run('saveConfig',S.config)); toast(`'${name}' 추가됨`); $(sel).value='';
       kind==='freq'?drawFreqCards():drawDurCards(); }
  catch(e){ toast('추가 실패: '+errMsg(e),true); }
}

const runKey=(st,b)=>st+'\u0001'+b;
const getRunning=()=>lsGet('bh_running',{});
function setRunning(o){ lsSet('bh_running',o); S.runningMem=o; }
function running(){ const o=getRunning(); return Object.keys(o).length?o:(S.runningMem||{}); }
async function renderDurRecord(){
  const el=$('#dur-record');

function drawDurCards(){
  const box=$('#durCards'); if(!box) return;
  const R=running(), mine={};
  Object.keys(R).forEach(k=>{ const [st,b]=k.split('\u0001'); if(st===S.student) mine[b]=R[k]; });
  const behs=stu().dur.slice(); Object.keys(mine).forEach(b=>{ if(!behs.includes(b)) behs.push(b); });
  box.innerHTML = behs.length ? behs.map(b=>{
    const t=mine[b], rs=S.durToday.filter(r=>r.behavior===b), tot=rs.reduce((s,r)=>s+r.seconds,0);
    return `<div class="bcard ${t?'run':''}"><div class="bhead"><b>${esc(b)}</b><span class="timer" ${t?`data-start="${t}"`:''}>${t?fmtSec((Date.now()-t)/1000):''}</span></div>
      <div class="row">${t?`<button class="stop" data-act="stop" data-b="${esc(b)}">■ 종료</button><button class="ghost sm" data-act="cancel" data-b="${esc(b)}">취소</button>`
                         :`<button class="go" data-act="start" data-b="${esc(b)}">▶ 시작</button>`}</div>
      <div class="mini">오늘 ${rs.length}회 · 총 ${fmtSec(tot)}${rs.length?` · 평균 ${fmtSec(tot/rs.length)}`:''}</div></div>`;
  }).join('') : '<div class="card muted">행동이 없습니다. 아래에서 입력하거나 설정에서 등록하세요.</div>';
  box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>({start:startDur,stop:stopDur,cancel:cancelDur})[b.dataset.act](b.dataset.b));
  const others=Object.keys(R).filter(k=>!k.startsWith(S.student+'\u0001')).map(k=>k.replace('\u0001',' - '));
  $('#durOther').innerHTML = others.length?`<div class="banner">다른 학생 측정 중: ${others.map(esc).join(', ')}</div>`:'';
  const log=$('#durLog'); if(!log) return;
  $('#durTotal').textContent=`총 ${S.durToday.length}회 · ${fmtSec(S.durToday.reduce((s,r)=>s+r.seconds,0))}`;
  const last=S.durToday.slice(-15).reverse();
  log.innerHTML = last.length ? last.map(r=>`<li><span>${esc(r.start)}~${esc(r.end)} · <b>${esc(r.behavior)}</b> · ${esc(r.durationText||fmtSec(r.seconds))}${r.place?` · <span class="muted">${esc(r.place)}</span>`:''}</span>
      ${r.pending?'<span class="muted small">저장 중…</span>':`<button class="ghost sm" data-del="${esc(r.id)}">삭제</button>`}</li>`).join('')
      : '<li class="muted">오늘 기록이 아직 없습니다.</li>';
  log.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRecord('dur',b.dataset.del,()=>{ S.durToday=S.durToday.filter(r=>r.id!==b.dataset.del); drawDurCards(); }));
}
function startDur(b){ const R=running(); const k=runKey(S.student,b); if(!R[k]){ R[k]=Date.now(); setRunning(R); } drawDurCards(); }
function cancelDur(b){ if(!confirm(`'${b}' 측정을 저장하지 않고 취소할까요?`)) return; const R=running(); delete R[runKey(S.student,b)]; setRunning(R); drawDurCards(); }
async function stopDur(b){
  const R=running(), k=runKey(S.student,b), st=R[k]; if(!st) return;
  const end=Date.now(); delete R[k]; setRunning(R);
  const d0=new Date(st), d1=new Date(end), sec=Math.round((end-st)/1000);
  const tmp={id:'tmp'+end,date:ymd(d0),dow:DOW[d0.getDay()],behavior:b,start:hm(d0)+':'+pad(d0.getSeconds()),end:hm(d1)+':'+pad(d1.getSeconds()),seconds:sec,durationText:fmtSec(sec),place:S.place,pending:true};
  S.durToday.push(tmp); drawDurCards();
  try{ const res=await run('saveDuration',{student:S.student,behavior:b,startTs:st,endTs:end,place:S.place}); tmp.id=res.id; tmp.pending=false; cacheAdd('dur',{...tmp,pending:undefined}); toast(`${b} ${fmtSec(sec)} 저장 ✓`); }
  catch(e){ S.durToday=S.durToday.filter(r=>r!==tmp); R[k]=st; setRunning(R); toast('저장 실패(측정은 계속 유지): '+errMsg(e),true); }
  drawDurCards();
}

/* ═════════════ 기록 캐시 · 미리 불러오기 ═════════════ */
const cKey=m=>m+'|'+S.student;
S.inflight={};
const todayStr=()=>ymd(new Date());
const DOW='일월화수목금토';
function unpack(p){ return { rows:p.v.map(a=>{ const o={}; p.k.forEach((k,i)=>o[k]=a[i]); return o; }), url:p.url, t:Date.now() }; }
/* 여러 기록법을 서버 한 번 호출로 가져오기 · 같은 요청이 진행 중이면 그 결과를 함께 기다림 */
function fetchMany(ms,force){
  const st=S.student, need=force?ms:ms.filter(m=>!S.inflight[m+'|'+st]);
  if(need.length){
    const pr=run('getPacked',need,st,!!force).then(res=>{ need.forEach(m=>{ S.cache[m+'|'+st]=unpack(res[m]); delete S.inflight[m+'|'+st]; persist(m,st); });
        if(st===S.student && need.includes(S.method) && !force) refreshView(); return res; })
      .catch(e=>{ need.forEach(m=>delete S.inflight[m+'|'+st]); throw e; });
    need.forEach(m=>S.inflight[m+'|'+st]=pr);
  }
  return Promise.all(ms.map(m=>S.inflight[m+'|'+st]||Promise.resolve())).then(()=>ms.map(m=>S.cache[m+'|'+st]));
}
const fetchRows=(m,force)=>fetchMany([m],force).then(a=>a[0]);
/* 캐시가 있으면 바로, 없으면 불러와서 */
function rowsOf(m){ const c=S.cache[cKey(m)]; return c?Promise.resolve(c):fetchRows(m); }
function prefetch(){ if(!S.student) return; const ms=['abc','freq','dur'].filter(m=>{ const c=S.cache[cKey(m)]; return !c||!c.t; }); if(ms.length) fetchMany(ms).catch(()=>{}); }
/* 저장·삭제를 캐시에 바로 반영 (다시 불러올 필요 없음) */
function cacheAdd(m,row){ const c=S.cache[cKey(m)]; if(!c) return; c.rows.push(row);
  const t=r=>r.date+(r.time||r.start||''); c.rows.sort((a,b)=>t(a).localeCompare(t(b))); persist(m,S.student); }
function cacheDel(m,id){ const c=S.cache[cKey(m)]; if(c){ c.rows=c.rows.filter(r=>r.id!==id); persist(m,S.student); } }

/* 이 브라우저에 기록 사본 보관 → 앱을 다시 열어도 바로 표시 (서버 응답은 뒤에서 반영) */
const lsKey=(m,st)=>'bh_c_'+m+'|'+st;
function persist(m,st){ const c=S.cache[m+'|'+st]; if(!c) return;
  try{ const s=JSON.stringify({rows:c.rows.filter(r=>!r.pending),url:c.url,t:c.t}); if(s.length<1500000) localStorage.setItem(lsKey(m,st),s); }catch(e){} }
function loadLocal(st){ ['abc','freq','dur'].forEach(m=>{ const k=m+'|'+st; if(S.cache[k]) return;
  const o=lsGet(lsKey(m,st),null); if(o&&Array.isArray(o.rows)) S.cache[k]={rows:o.rows,url:o.url||'',t:0}; }); }
function setPacked(st,packed){ Object.keys(packed||{}).forEach(m=>{ S.cache[m+'|'+st]=unpack(packed[m]); persist(m,st); }); }
/* 새 데이터가 오면 입력 중인 칸은 건드리지 않고 목록·숫자만 다시 그림 */
function refreshView(){
  if(!S.config||!S.student||S.method==='settings') return;
  const c=S.cache[cKey(S.method)]; if(!c) return;
  if(S.view==='dash'){ if($('#'+S.method+'-dash .dash')) useRows(S.method,c); return; }
  if(S.method==='abc') return loadABCToday();
  const pend=(S.method==='freq'?S.freqToday:S.durToday).filter(r=>r.pending);
  const today=c.rows.filter(r=>r.date===todayStr()).concat(pend);
  if(S.method==='freq'){ S.freqToday=today; drawFreqCards(); } else { S.durToday=today; drawDurCards(); }
}

const mcColor=()=>getComputedStyle(document.body).getPropertyValue('--mc').trim()||'#ef6f53';
function destroyCharts(){ S.charts.forEach(c=>c.destroy()); S.charts=[]; }
function chart(id,type,labels,datasets,opt){
  const cv=document.getElementById(id); if(!cv||!window.Chart) return;
  const base={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:datasets.length>1||type==='doughnut',position:'bottom',labels:{boxWidth:12}}}};
  if(type!=='doughnut') base.scales={y:{beginAtZero:true,ticks:{precision:0}}};

const stat=(k,v)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
function countBy(rows,fn,split){ const m=new Map();
  rows.forEach(r=>{ const v=fn(r); (split?splitList(v):[v]).map(x=>String(x??'').trim()).filter(Boolean).forEach(x=>m.set(x,(m.get(x)||0)+1)); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function dateAxis(rows){
  const today=new Date(); let start;
  if(S.days>0){ start=new Date(today); start.setDate(start.getDate()-(S.days-1)); }
  else { if(!rows.length) return []; const p=rows[0].date.split('-').map(Number); start=new Date(p[0],p[1]-1,p[2]); }
  const out=[]; for(let d=new Date(start); ymd(d)<=ymd(today); d.setDate(d.getDate()+1)) out.push(ymd(d));
  return out;
}
const short=d=>d.slice(5).replace('-','/');
const hourOf=r=>parseInt(r.time||r.start||'',10);
function hourAxis(rows){ const hs=rows.map(hourOf).filter(h=>!isNaN(h)); if(!hs.length) return [];
  const a=Math.min(8,...hs), b=Math.max(16,...hs); return Array.from({length:b-a+1},(_,i)=>a+i); }

function useRows(m,c){

  return `<div class="stucard" data-i="${i}">
    <div class="row"><input class="sName" value="${esc(s.name)}" placeholder="학생 이름 (또는 별칭)" style="flex:1"><button class="ghost sm" data-rm="${i}">삭제</button></div>
    <div class="cols">${ta('','ABC 행동(B) 목록',s.abc,4).replace('id=""','class="sAbc"')}${ta('','빈도 기록 표적행동',s.freq,4).replace('id=""','class="sFreq"')}${ta('','지속시간 기록 행동',s.dur,4).replace('id=""','class="sDur"')}</div></div>`;
}
function renderSettings(){
  const c=S.config, el=$('#settings');
  c.students=c.students||[]; ['antecedents','consequences','places'].forEach(k=>c[k]=c[k]||[]);
  c.students.forEach(s=>['abc','freq','dur'].forEach(k=>s[k]=s[k]||[]));
  el.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">⚙️ 설정</h2>
    <button class="ghost" onclick="$('#gearBtn').click()">← 기록 화면으로</button></div>
  <div class="card"><h2>학생 및 표적행동</h2>
    <p class="muted small">한 줄에 하나씩 적으세요. 기록법마다 구글 시트 파일이 하나씩 생기고, 그 안에 학생마다 탭이 자동으로 만들어집니다. (학생 이름을 바꾸면 새 탭으로 기록됩니다)</p>
    <div id="stuList">${c.students.map(stuCard).join('')}</div>
    <button class="ghost" id="stuAdd">+ 학생 추가</button></div>
  <div class="card"><h2>ABC · 공통 선택지</h2>
    <div class="cols" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
    ${ta('pA','선행사건(A) 목록',c.antecedents,8)}${ta('pC','후속결과(C) 목록',c.consequences,8)}${ta('pP','장소/활동 목록',c.places,8)}</div></div>
  <div class="card"><h2>구글 시트 파일</h2>
    ${['abc','freq','dur'].map(k=>`<div style="margin-bottom:6px">${METHOD_LABEL[k]}: ${S.files[k]?`<a href="${esc(S.files[k])}" target="_blank">시트 열기</a>`:'<span class="muted">첫 기록을 저장하면 자동으로 만들어집니다</span>'}</div>`).join('')}</div>
  <button class="pri big" id="cfgSave">설정 저장</button>`;
  $('#stuAdd').onclick=()=>{ S.config=readSettings(); S.config.students.push({name:'',abc:[],freq:[],dur:[]}); renderSettings();
    const ins=document.querySelectorAll('.sName'); ins[ins.length-1].focus(); };
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(!confirm('이 학생을 목록에서 뺄까요? (시트의 기존 기록은 지워지지 않습니다)')) return;
    S.config=readSettings(); S.config.students.splice(+b.dataset.rm,1); renderSettings(); });
  $('#cfgSave').onclick=async e=>{ e.currentTarget.disabled=true;
    try{ applyState(await run('saveConfig',readSettings())); toast('설정을 저장했습니다 ✓'); renderSettings(); }
    catch(err){ toast('저장 실패: '+errMsg(err),true); e.currentTarget.disabled=false; } };
}
function readSettings(){
  const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  return {
    students: [...document.querySelectorAll('.stucard')].map(c=>({ name:c.querySelector('.sName').value.trim(),
      abc:lines(c.querySelector('.sAbc').value), freq:lines(c.querySelector('.sFreq').value), dur:lines(c.querySelector('.sDur').value) })),
    antecedents: lines($('#pA').value), consequences: lines($('#pC').value), places: lines($('#pP').value)
  };
}

init();
</script>
</body>
</html>
